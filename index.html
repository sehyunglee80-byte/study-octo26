<title>LCD 뱀 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Gothic+A1:wght@400;700&display=swap">
<style>
  /* 레이아웃: 옛 휴대폰 LCD 화면 하나를 가운데 두고, 아래에 방향 버튼을 둔 단일 화면 게임기 */
  :root {
    --case: #2b3a33;      /* 기기 몸체 */
    --case-edge: #1c2722;
    --lcd: #9fbc8a;       /* LCD 바탕 */
    --ink: #1f2b1c;       /* LCD 픽셀 */
    --ghost: #8cab78;     /* 꺼진 픽셀 */
    --label: #d6e2cf;     /* 몸체 위 글자 */
    --key: #3d5046;
    --font-pixel: "Silkscreen", "Courier New", monospace;
    --font-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--case-edge);
    color: var(--label);
    font-family: var(--font-body);
    display: flex;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
  }
  .device {
    width: 100%;
    max-width: 420px;
    background: var(--case);
    border-radius: 28px 28px 48px 48px;
    padding: 20px 18px 28px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-self: flex-start;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.35);
  }
  .brand {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--font-pixel); font-size: 13px; letter-spacing: .12em;
  }
  .brand small { font-family: var(--font-body); font-size: 12px; letter-spacing: 0; opacity: .7; }
  .screen {
    background: var(--lcd);
    border-radius: 6px;
    border: 6px solid var(--case-edge);
    padding: 10px;
    display: flex; flex-direction: column; gap: 8px;
    position: relative;
  }
  .hud {
    display: flex; justify-content: space-between;
    font-family: var(--font-pixel); color: var(--ink); font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  canvas { width: 100%; aspect-ratio: 1; max-width: 100%; display: block; image-rendering: pixelated; }
  .overlay {
    position: absolute; inset: 40px 10px 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(159,188,138,.88);
    color: var(--ink); text-align: center;
  }
  .overlay h1 { font-family: var(--font-pixel); font-size: 28px; margin: 0; font-weight: 400; text-wrap: balance; }
  .overlay p { margin: 0; font-size: 14px; line-height: 1.5; }
  .btn {
    font: 700 14px var(--font-body);
    background: var(--ink); color: var(--lcd);
    border: 0; border-radius: 4px; padding: 10px 18px; cursor: pointer;
  }
  .btn:focus-visible, .key:focus-visible { outline: 3px solid var(--label); outline-offset: 2px; }
  .pad {
    display: grid;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    justify-content: center;
  }
  .key {
    background: var(--key); color: var(--label);
    border: 0; border-radius: 12px; font-size: 20px; cursor: pointer;
    box-shadow: 0 4px 0 var(--case-edge);
    touch-action: manipulation;
  }
  .key:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--case-edge); }
  .key.up { grid-area: 1 / 2; } .key.left { grid-area: 2 / 1; }
  .key.mid { grid-area: 2 / 2; font: 700 12px var(--font-body); }
  .key.right { grid-area: 2 / 3; } .key.down { grid-area: 3 / 2; }
  .help { margin: 0; font-size: 12px; line-height: 1.6; opacity: .75; text-align: center; }
</style>

<div class="device">
  <div class="brand"><span>SNAKE-26</span><small>먹이를 먹을수록 빨라집니다</small></div>

  <div class="screen">
    <div class="hud"><span>점수 <b id="score">0</b></span><span>최고 <b id="best">0</b></span></div>
    <canvas id="board" width="300" height="300" aria-label="게임 화면"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="ov-title">SNAKE</h1>
      <p id="ov-text">방향키 또는 화면 스와이프로 움직이세요.<br>벽을 넘으면 반대편에서 나옵니다.<br>내 몸에 닿으면 끝납니다.</p>
      <button class="btn" id="start">시작하기</button>
    </div>
  </div>

  <div class="pad">
    <button class="key up" data-dir="up" aria-label="위">▲</button>
    <button class="key left" data-dir="left" aria-label="왼쪽">◀</button>
    <button class="key mid" id="pause">일시정지</button>
    <button class="key right" data-dir="right" aria-label="오른쪽">▶</button>
    <button class="key down" data-dir="down" aria-label="아래">▼</button>
  </div>
  <p class="help">키보드: 방향키 또는 WASD · 스페이스로 일시정지</p>
</div>

<script>
  const N = 20;                 // 한 줄 칸 수
  const CELL = 300 / N;         // 칸 크기 (px)
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const INK = css.getPropertyValue('--ink').trim();
  const GHOST = css.getPropertyValue('--ghost').trim();

  const $ = id => document.getElementById(id);
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  let snake, dir, nextDir, food, score, timer, running, paused;
  let best = 0;
  try { best = Number(localStorage.getItem('snake-best')) || 0; } catch (e) {}
  $('best').textContent = best;

  function reset() {
    snake = [[10, 10], [9, 10], [8, 10]];
    dir = nextDir = 'right';
    score = 0;
    $('score').textContent = 0;
    placeFood();
  }

  function placeFood() {
    do {
      food = [Math.floor(Math.random() * N), Math.floor(Math.random() * N)];
    } while (snake.some(([x, y]) => x === food[0] && y === food[1]));
  }

  // 먹이 하나당 5ms씩 빨라지고, 60ms보다 빨라지지는 않음
  const speed = () => Math.max(60, 150 - score * 5);

  function tick() {
    dir = nextDir;
    const [dx, dy] = DIRS[dir];
    // 벽을 넘으면 반대편에서 나옴
    const head = [(snake[0][0] + dx + N) % N, (snake[0][1] + dy + N) % N];
    // 이번 턴에 비워질 꼬리 칸은 부딪힘에서 제외
    const body = snake.slice(0, -1);
    if (body.some(([x, y]) => x === head[0] && y === head[1])) return gameOver();

    snake.unshift(head);
    if (head[0] === food[0] && head[1] === food[1]) {
      score++;
      $('score').textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
    draw();
    timer = setTimeout(tick, speed());
  }

  function pixel(x, y, color, inset = 1) {
    ctx.fillStyle = color;
    ctx.fillRect(x * CELL + inset, y * CELL + inset, CELL - inset * 2, CELL - inset * 2);
  }

  function draw() {
    ctx.clearRect(0, 0, 300, 300);
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) pixel(x, y, GHOST);
    snake.forEach(([x, y]) => pixel(x, y, INK));
    pixel(food[0], food[1], INK, 4);
  }

  function start() {
    clearTimeout(timer);
    reset();
    draw();
    running = true; paused = false;
    $('overlay').hidden = true;
    $('pause').textContent = '일시정지';
    timer = setTimeout(tick, speed());
  }

  function gameOver() {
    running = false;
    if (score > best) {
      best = score;
      $('best').textContent = best;
      try { localStorage.setItem('snake-best', best); } catch (e) {}
    }
    $('ov-title').textContent = 'GAME OVER';
    $('ov-text').textContent = `이번 점수는 ${score}점입니다.`;
    $('start').textContent = '다시 하기';
    $('overlay').hidden = false;
    $('start').focus();
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    $('pause').textContent = paused ? '계속' : '일시정지';
    if (paused) clearTimeout(timer);
    else timer = setTimeout(tick, speed());
  }

  // 바로 반대 방향으로는 꺾을 수 없음
  function turn(d) {
    const opposite = { up: 'down', down: 'up', left: 'right', right: 'left' };
    if (running && !paused && d !== opposite[dir]) nextDir = d;
  }

  const KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right'
  };
  document.addEventListener('keydown', e => {
    if (KEYS[e.key]) { e.preventDefault(); turn(KEYS[e.key]); }
    else if (e.key === ' ' && running) { e.preventDefault(); togglePause(); }
  });

  document.querySelectorAll('[data-dir]').forEach(b =>
    b.addEventListener('click', () => turn(b.dataset.dir)));
  $('pause').addEventListener('click', togglePause);
  $('start').addEventListener('click', start);

  // 화면 스와이프
  let touch = null;
  canvas.addEventListener('touchstart', e => { touch = e.touches[0]; }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touch) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.clientX, dy = t.clientY - touch.clientY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) {
      turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    }
    touch = null;
  });

  reset();
  draw();
</script>
