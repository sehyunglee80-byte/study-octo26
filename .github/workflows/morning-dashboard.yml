name: Morning dashboard data

# 매일 아침 Claude 예약 작업이 workflow_dispatch 로 실행한다.
# 예약 실행은 늦어질 수 있어 07:20 KST 백업 실행만 걸어 둔다.
on:
  schedule:
    - cron: "20 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-dashboard
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data
        run: python morning-dashboard/fetch.py

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add morning-dashboard/data.json morning-dashboard/out
          if ! git diff --cached --quiet; then
            git commit -m "Update morning dashboard data"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
