name: Sector PE probe

# 임시: 섹터 PER 데이터 출처 확인용. 확인 후 삭제한다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Render page
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          base="https://advantage.factset.com/hubfs/Website/Resources%20Section/Research%20Desk/Earnings%20Insight"
          curl -sL -A "Mozilla/5.0" -o ei.pdf "$base/EarningsInsight_112026.pdf"
          p=$(pdftotext -layout ei.pdf - | awk -v RS='\f' '/Forward 12M P\/E Ratio: Sector Level/{print NR; exit}')
          mkdir out
          pdftoppm -f $p -l $p -r 150 -png ei.pdf out/page
          pdfimages -f $p -l $p -list ei.pdf
          pdfimages -f $p -l $p -png ei.pdf out/img
          ls -la out
          echo BEGIN1; base64 -w0 out/img-001.png; echo; echo END1
