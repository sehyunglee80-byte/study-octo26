name: Sector PE probe

# 임시: FactSet Earnings Insight PDF 에서 섹터 PER 을 뽑을 수 있는지 확인용. 확인 후 삭제한다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download and dump
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          base="https://advantage.factset.com/hubfs/Website/Resources%20Section/Research%20Desk/Earnings%20Insight"
          for d in 112026 111326; do
            code=$(curl -sL -A "Mozilla/5.0" -o ei_$d.pdf -w "%{http_code}" "$base/EarningsInsight_$d.pdf")
            echo "== $d HTTP $code"; file ei_$d.pdf
          done
          f=$(ls -S ei_*.pdf | head -1); echo "using $f"
          pdfinfo $f | head -5
          pdftotext -layout $f out.txt
          grep -n -i "P/E" out.txt | head -60
          echo "===== sector level pages"
          awk '/Sector Level/{f=1} f{print; n++} n>80{exit}' out.txt
          echo "===== images count"; pdfimages -list $f | wc -l
