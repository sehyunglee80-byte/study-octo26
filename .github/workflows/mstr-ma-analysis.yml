name: MSTR MA analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "mstr-ma/**"
      - ".github/workflows/mstr-ma-analysis.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze
        run: python mstr-ma/analyze.py

      - uses: actions/upload-artifact@v4
        with:
          name: mstr-ma-analysis
          path: mstr-ma/analysis.md
