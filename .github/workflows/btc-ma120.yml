name: BTC MA120 cross check

on:
  # 예약 실행은 꺼 두었다. 전략을 200일선 주간 신호(btc-ma200-weekly)로 바꿨기 때문.
  # 다시 켜려면 아래 주석을 푼다.
  # schedule:
  #   - cron: "7 * * * *" # 매시 7분(UTC). GitHub 사정에 따라 몇 분 늦게 실행될 수 있음
  workflow_dispatch:
    inputs:
      notify_status:
        description: "크로스가 없어도 현재 상태를 텔레그램으로 보내기(연결 테스트용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: btc-ma120
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check cross
        env:
          SOURCE: ${{ vars.BTC_SOURCE || 'upbit' }}
          MA_DAYS: ${{ vars.BTC_MA_DAYS || '120' }}
          BAND_PCT: ${{ vars.BTC_BAND_PCT || '0' }}
          NOTIFY_STATUS: ${{ inputs.notify_status && '1' || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python btc-ma120/check.py

      - name: Save state, or keep the schedule alive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain btc-ma120/state.json)" ]; then
            git add btc-ma120/state.json
            git commit -m "Update BTC MA120 state"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 30 * 86400 )) ]; then
            # 공개 저장소는 60일간 커밋이 없으면 예약 실행이 멈추므로, 30일 넘게 조용하면 기록을 남긴다
            date -u +%Y-%m-%dT%H:%M:%SZ > btc-ma120/keepalive.txt
            git add btc-ma120/keepalive.txt
            git commit -m "Keep BTC MA120 schedule active"
            git push
          fi
