name: BTC MA120 cross check

on:
  schedule:
    - cron: "7 * * * *" # 매시 7분(UTC). GitHub 사정에 따라 몇 분 늦게 실행될 수 있음
  workflow_dispatch:
    inputs:
      notify_status:
        description: "크로스가 없어도 현재 상태를 텔레그램으로 보내기(연결 테스트용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: btc-ma120
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check cross
        env:
          SOURCE: ${{ vars.BTC_SOURCE || 'upbit' }}
          MA_DAYS: ${{ vars.BTC_MA_DAYS || '120' }}
          BAND_PCT: ${{ vars.BTC_BAND_PCT || '0' }}
          NOTIFY_STATUS: ${{ inputs.notify_status && '1' || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python btc-ma120/check.py

      - name: Save state when it changes
        run: |
          if [ -n "$(git status --porcelain btc-ma120/state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add btc-ma120/state.json
            git commit -m "Update BTC MA120 state"
            git push
          fi
