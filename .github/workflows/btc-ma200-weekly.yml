name: BTC MA200 weekly signal

on:
  # 예약 실행은 꺼 두었다. 알림을 120·200일선 2% 여유 폭 매일 신호(btc-ma-band-daily)로 바꿨기 때문.
  # 다시 켜려면 아래 주석을 푼다.
  # schedule:
  #   # 매주 월요일 09:05 / 09:35 / 10:05 KST. GitHub 예약 실행이 늦거나 빠지는 경우를 대비해 세 번 걸고,
  #   # 이미 처리한 주는 signal.py 가 건너뛴다.
  #   - cron: "5 0 * * 1"
  #   - cron: "35 0 * * 1"
  #   - cron: "5 1 * * 1"
  workflow_dispatch:
    inputs:
      manual:
        description: "현재 상태를 텔레그램으로 받기 (상태 파일은 바꾸지 않음)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: btc-ma200-weekly
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Weekly signal
        env:
          MANUAL: ${{ inputs.manual && '1' || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python btc-ma200-weekly/signal.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain btc-ma200-weekly/state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add btc-ma200-weekly/state.json
            git commit -m "Update BTC MA200 weekly state"
            git push
          fi
