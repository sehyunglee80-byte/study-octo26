<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC 120일선 알림</title>
<style>
  :root {
    --bg: #f6f4f0; --card: #ffffff; --ink: #1d1c1a; --muted: #6d6860; --line: #e3ded5;
    --price: #d9822b; --ma: #3b6fd8; --up: #c0392b; --down: #2464c8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark;
      --bg: #181715; --card: #23211e; --ink: #f0ece5; --muted: #a29c92; --line: #38352f;
      --price: #f0a04b; --ma: #7aa2f7; --up: #ff6b5e; --down: #6aa5ff;
    }
  }
  :root[data-theme="dark"] { color-scheme: dark;
    --bg: #181715; --card: #23211e; --ink: #f0ece5; --muted: #a29c92; --line: #38352f;
    --price: #f0a04b; --ma: #7aa2f7; --up: #ff6b5e; --down: #6aa5ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; word-break: break-all; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; color: #fff; }
  .badge.above { background: var(--up); } .badge.below { background: var(--down); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  select, input, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  input[type=number] { width: 72px; }
  button { cursor: pointer; background: var(--ink); color: var(--bg); border-color: var(--ink); }
  canvas { width: 100%; height: 260px; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
  ul.log { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  ul.log li { padding: 6px 0; border-top: 1px solid var(--line); }
  ul.log li:first-child { border-top: 0; }
  .err { color: var(--up); font-size: 13px; }
  @media (max-width: 520px) { .stats { grid-template-columns: 1fr 1fr; } .stat.wide { grid-column: span 2; } }
</style>
</head>
<body>
<main>
  <h1>비트코인 120일 이동평균선 알림</h1>
  <p class="sub">일봉 종가 기준 이동평균과 현재가를 주기적으로 비교해 교차하면 알려 드립니다. 이 페이지가 열려 있는 동안만 동작합니다.</p>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <span id="badge" class="badge">불러오는 중</span>
      <span class="sub" id="updated" style="margin:0"></span>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">현재가</div><div class="v" id="price">-</div></div>
      <div class="stat"><div class="k" id="maLabel">120일선</div><div class="v" id="ma">-</div></div>
      <div class="stat wide"><div class="k">괴리율</div><div class="v" id="gap">-</div></div>
    </div>
    <p class="err" id="err" hidden></p>
  </div>

  <div class="card">
    <canvas id="chart"></canvas>
    <div class="legend"><span><i style="background:var(--price)"></i>일봉 종가</span><span><i style="background:var(--ma)"></i><span id="legendMa">120일선</span></span></div>
  </div>

  <div class="card row">
    <label>거래소 <select id="source"><option value="upbit">업비트 KRW</option><option value="binance">바이낸스 USDT</option></select></label>
    <label>기간 <input id="days" type="number" min="5" max="200" value="120">일</label>
    <label>점검 주기 <select id="interval"><option value="1">1분</option><option value="5" selected>5분</option><option value="15">15분</option><option value="60">1시간</option></select></label>
    <label>여유 폭 <input id="band" type="number" min="0" max="10" step="0.1" value="0">%</label>
    <button id="notifyBtn" type="button">알림 허용</button>
  </div>

  <div class="card">
    <div class="k sub" style="margin:0 0 6px">크로스 기록</div>
    <ul class="log" id="log"><li class="sub">아직 기록이 없습니다.</li></ul>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const settings = Object.assign({ source: "upbit", days: 120, interval: 5, band: 0 }, store.get("btcma.settings", {}));
  $("source").value = settings.source; $("days").value = settings.days;
  $("interval").value = settings.interval; $("band").value = settings.band;

  const HISTORY = 200; // 차트에 그릴 일수
  let timer = null, lastData = null;

  async function fetchCloses(source, need) {
    if (source === "binance") {
      const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=${need}`);
      if (!r.ok) throw new Error(`바이낸스 응답 ${r.status}`);
      return { rows: (await r.json()).map(k => ({ t: k[0], c: +k[4] })), unit: "$", pair: "BTC/USDT" };
    }
    // 업비트는 한 번에 200개까지
    const r = await fetch(`https://api.upbit.com/v1/candles/days?market=KRW-BTC&count=${Math.min(need, 200)}`);
    if (!r.ok) throw new Error(`업비트 응답 ${r.status}`);
    const rows = (await r.json()).reverse().map(k => ({ t: Date.parse(k.candle_date_time_utc + "Z"), c: k.trade_price }));
    return { rows, unit: "₩", pair: "BTC/KRW" };
  }

  function movingAverage(closes, n) {
    const out = new Array(closes.length).fill(null);
    let sum = 0;
    closes.forEach((c, i) => { sum += c; if (i >= n) sum -= closes[i - n]; if (i >= n - 1) out[i] = sum / n; });
    return out;
  }

  const fmt = (v, unit) => unit + (unit === "$" ? v.toLocaleString("en-US", { maximumFractionDigits: 0 }) : Math.round(v).toLocaleString("ko-KR"));
  const stamp = d => d.toLocaleString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });

  function judge(price, ma, prev, band) {
    if (price > ma * (1 + band / 100)) return "above";
    if (price < ma * (1 - band / 100)) return "below";
    return prev || (price >= ma ? "above" : "below");
  }

  function alertCross(kind, text) {
    if ("Notification" in window && Notification.permission === "granted") {
      try { new Notification(kind, { body: text }); } catch {}
    }
    try { // 짧은 알림음
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(); o.frequency.value = 880; o.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.25);
    } catch {}
  }

  function renderLog() {
    const log = store.get("btcma.log", []);
    $("log").innerHTML = log.length
      ? log.map(e => `<li><b style="color:var(--${e.dir === "above" ? "up" : "down"})">${e.kind}</b> · ${e.text} · <span class="sub">${e.at}</span></li>`).join("")
      : '<li class="sub">아직 기록이 없습니다.</li>';
  }

  async function check() {
    const { source, days, band } = settings;
    try {
      const { rows, unit, pair } = await fetchCloses(source, HISTORY);
      if (rows.length < days) throw new Error(`데이터 부족: ${rows.length}일`);
      const closes = rows.map(r => r.c);
      const mas = movingAverage(closes, days);
      const price = closes.at(-1), ma = mas.at(-1), gap = (price / ma - 1) * 100;

      const key = `btcma.pos.${source}.${days}`;
      const prev = store.get(key, null);
      const now = judge(price, ma, prev, band);
      if (prev && prev !== now) {
        const kind = now === "above" ? "골든크로스(상향 돌파)" : "데드크로스(하향 이탈)";
        const text = `${pair} ${fmt(price, unit)} / ${days}일선 ${fmt(ma, unit)} (${gap >= 0 ? "+" : ""}${gap.toFixed(2)}%)`;
        alertCross(`BTC ${kind}`, text);
        const log = store.get("btcma.log", []);
        log.unshift({ kind, dir: now, text, at: stamp(new Date()) });
        store.set("btcma.log", log.slice(0, 50));
        renderLog();
      }
      store.set(key, now);

      $("badge").className = "badge " + now;
      $("badge").textContent = now === "above" ? `${days}일선 위` : `${days}일선 아래`;
      $("price").textContent = fmt(price, unit);
      $("ma").textContent = fmt(ma, unit);
      $("maLabel").textContent = $("legendMa").textContent = `${days}일선`;
      $("gap").textContent = `${gap >= 0 ? "+" : ""}${gap.toFixed(2)}%`;
      $("gap").style.color = `var(--${gap >= 0 ? "up" : "down"})`;
      $("updated").textContent = `${pair} · ${stamp(new Date())} 갱신`;
      $("err").hidden = true;
      lastData = { closes, mas, unit };
      draw();
    } catch (e) {
      $("err").hidden = false;
      $("err").textContent = `시세를 불러오지 못했습니다: ${e.message}`;
    }
  }

  function draw() {
    if (!lastData) return;
    const { closes, mas } = lastData;
    const cv = $("chart"), dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
    const css = getComputedStyle(document.documentElement);
    const vals = closes.concat(mas.filter(v => v != null));
    const min = Math.min(...vals), max = Math.max(...vals), pad = 8;
    const x = i => pad + (i / (closes.length - 1)) * (w - pad * 2);
    const y = v => pad + (1 - (v - min) / (max - min || 1)) * (h - pad * 2);
    const line = (arr, color, width) => {
      ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = "round";
      let started = false;
      arr.forEach((v, i) => { if (v == null) return; started ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v)); started = true; });
      ctx.stroke();
    };
    line(mas, css.getPropertyValue("--ma").trim(), 2);
    line(closes, css.getPropertyValue("--price").trim(), 2);
  }

  function restart() {
    clearInterval(timer);
    check();
    timer = setInterval(check, settings.interval * 60 * 1000);
  }

  function onChange() {
    settings.source = $("source").value;
    settings.days = Math.max(5, Math.min(200, parseInt($("days").value, 10) || 120));
    settings.interval = +$("interval").value;
    settings.band = Math.max(0, parseFloat($("band").value) || 0);
    store.set("btcma.settings", settings);
    restart();
  }
  ["source", "days", "interval", "band"].forEach(id => $(id).addEventListener("change", onChange));

  const nb = $("notifyBtn");
  const syncBtn = () => {
    if (!("Notification" in window)) { nb.textContent = "알림 미지원"; nb.disabled = true; return; }
    nb.textContent = Notification.permission === "granted" ? "알림 켜짐" : "알림 허용";
    nb.disabled = Notification.permission === "granted";
  };
  nb.addEventListener("click", () => Notification.requestPermission().then(syncBtn));
  syncBtn();

  window.addEventListener("resize", draw);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
  renderLog();
  restart();
})();
</script>
</body>
</html>
